[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Local stock data explorer and signal analysis notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.65,<1",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "plotly>=6,<8",
    "notebook>=7,<9",
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "scipy>=1.11,<2",
]

[tool.uv]
package = false
